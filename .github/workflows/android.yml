name: Android Installable Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Generate release signing key
        run: |
          keytool -genkeypair -v \\
            -keystore release-keystore.jks \\
            -storepass SchoolService2026 \\
            -keypass SchoolService2026 \\
            -alias schoolservice \\
            -keyalg RSA \\
            -keysize 2048 \\
            -validity 10000 \\
            -dname "CN=PRDWEST, OU=School Service Manager, O=PRDWEST, L=Tehran, ST=Tehran, C=IR"
      - name: Sign release APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \\
            --ks release-keystore.jks \\
            --ks-pass pass:SchoolService2026 \\
            --key-pass pass:SchoolService2026 \\
            --ks-key-alias schoolservice \\
            --out app/build/outputs/apk/release/school-service-manager-release.apk \\
            app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify signed APK
        run: |
          test -f app/build/outputs/apk/release/school-service-manager-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/school-service-manager-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: school-service-manager-release-installable
          path: app/build/outputs/apk/release/school-service-manager-release.apk
          if-no-files-found: error
