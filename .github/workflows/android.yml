name: Android Installable Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Prepare stable signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64" || (echo "Missing GitHub Actions secret RELEASE_KEYSTORE_B64" && exit 1)
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks
      - name: Sign release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_PASSWORD" || (echo "Missing RELEASE_KEYSTORE_PASSWORD" && exit 1)
          test -n "$RELEASE_KEY_PASSWORD" || (echo "Missing RELEASE_KEY_PASSWORD" && exit 1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks release-keystore.jks             --ks-pass "env:RELEASE_KEYSTORE_PASSWORD"             --key-pass "env:RELEASE_KEY_PASSWORD"             --out app/build/outputs/apk/release/school-service-manager-release.apk             app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify signed APK
        run: |
          test -f app/build/outputs/apk/release/school-service-manager-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/school-service-manager-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: school-service-manager-release-installable
          path: app/build/outputs/apk/release/school-service-manager-release.apk
          if-no-files-found: error
